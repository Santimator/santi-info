name: Build and Deploy Hugo

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: ${{ runner.os }}-hugo-gen-${{ hashFiles('assets/**') }}
          restore-keys: |
            ${{ runner.os }}-hugo-gen-

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.120.4'
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Install htmltest
        run: |
          curl -sSfL https://htmltest.wjdp.uk | bash
          sudo mv bin/htmltest /usr/local/bin/htmltest

      - name: Validate HTML and check links
        run: |
          htmltest \
            --conf .htmltest.yml \
            public/
        continue-on-error: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: Static-site