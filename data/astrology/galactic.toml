intro = "Bringing all the elements together, three symbolic themes stand out."

[[themes.items]]
name = "The search for roots and deep knowledge"
description = "The concentration of planets in Capricorn, the 4th house and Lyra all point toward this motif."

[[themes.items]]
name = "Integrating the inner world with outer contribution"
description = "The connections between Lyra and Sirius, together with the IV–X axis, suggest a link between what is understood personally and what one wishes to share."

[[themes.items]]
