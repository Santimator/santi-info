{{ define "main" }}
<div class="content-shell">
    <article class="page-article">
        <header>
            <h1>{{ .Site.Title }}</h1>
        </header>

        <section class="smj-content">
            <img src="/images/profile.jpg" alt="Santiago Moreno" class="smj-profile-image">
            {{ .Content }}
        </section>
    </article>
    {{/* Build stamp for SMJ page */}}
    {{ $buildDate := default now .Site.Params.buildDate }}
    <div class="site-credits" aria-label="Site credits">
        <p>Built with Hugo and <abbr title="Claude Opus 4.5, Opus 4.6, Opus 5.5 and Sonnet 4.6">Claude O4.5, 4.6, 5.5 and S4.6</abbr>. Last build {{ $buildDate | time.Format "2006-01-02" }}.</p>
    </div>
</div>
{{ end }}
