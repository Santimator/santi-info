<nav class="site-nav" aria-label="Primary">
    <div class="nav-inner content-shell">
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
            <svg class="hamburger-icon" aria-hidden="true" focusable="false" width="18" height="14" viewBox="0 0 18 14" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <rect y="0" width="18" height="2" rx="1"/>
                <rect y="6" width="18" height="2" rx="1"/>
                <rect y="12" width="18" height="2" rx="1"/>
            </svg>
            <span class="nav-toggle-label">SMJ+</span>
        </button>
        {{ with .Site.Menus.main }}
        <div class="nav-panel" id="nav-menu" aria-hidden="true" hidden>
            <ul class="nav-menu">
                {{ $current := $ }}
                {{ range . }}
                <li>
                    <a class="{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }}is-active{{ end }}" href="{{ .URL | relURL }}">{{ .Name }}</a>
                </li>
                {{ end }}
            </ul>
        </div>
        {{ end }}
        <button class="theme-toggle theme-toggle-nav" type="button" aria-label="Toggle theme">
            <span class="theme-toggle-icon" aria-hidden="true">🌗</span>
        </button>
    </div>
</nav>
